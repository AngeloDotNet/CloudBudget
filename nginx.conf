# Esempio di server block nginx per reverse proxy verso Kestrel (.NET)
# Salva questo file in /etc/nginx/sites-available/budgetapp e crea il symlink in sites-enabled

server {
    listen 80;
    server_name example.com www.example.com;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # Path ai certificati (Let's Encrypt esempio)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Recommended headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings to backend Kestrel
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # preserve host
        proxy_set_header   Host $host;

        # real client IP
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # original scheme (http/https)
        proxy_set_header   X-Forwarded-Proto $scheme;

        # If the client sends X-Client-Id, forward it; otherwise backend can accept client id in body/header
        proxy_set_header   X-Client-Id $http_x_client_id;

        # handle websockets or keep-alive
        proxy_set_header   Connection "";
        proxy_buffering off;

        # timeouts (adjust to your needs)
        proxy_connect_timeout       10s;
        proxy_send_timeout          30s;
        proxy_read_timeout          30s;
        send_timeout                30s;
    }

    # Optional: serve swagger UI static files or other assets if needed
    location /swagger {
        proxy_pass http://127.0.0.1:5000/swagger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: security - restrict access to management endpoints if needed
    #location /admin {
    #    allow 1.2.3.4;   # nginx IP whitelist
    #    deny all;
    #    proxy_pass http://127.0.0.1:5000/admin;
    #}
}